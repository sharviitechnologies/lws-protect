<script>
class DCLogic { constructor(p){ this.props=p||{}; this.state={}; } setState(o){ Object.assign(this.state,o); render(); } }

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mon: 0, ind: 0, pMon: 0, pTier: 0, faqOpen: 0, step: -1 }; }
  renderVals() {
    const s = this.state;
    const set = (o) => this.setState(o);
    const seg = "min-height: 46px; border: none; cursor: pointer; font: 600 14px system-ui; ";
    const MONL = ["Your team responds", "24/7 monitoring responds"];
    const J = [
      [["Alert", "An SOS alarm or missed check-in raises an alert, with the worker’s location.", false],

      [["Alert", "An SOS alarm or missed check-in raises an alert, with the worker’s location.", false],

    const IND = [
      { name: "Retail", situation: "Opening, closing or working outside normal hours.", help: "An SOS alarm on the phone they already carry.", draft: true },
      { name: "Education", situation: "Staff on site alone before or after hours.", help: "Welfare check timers confirm they are safe.", draft: true },
      { name: "Property Management", situation: "Visiting properties, tenants and vacant units.", help: "Location sharing and SOS alarm during visits.", draft: true },
      { name: "Charities", situation: "Staff and volunteers working alone in the community.", help: "Raise an alert fast; your team or 24/7 operators respond.", draft: true },
      { name: "Community Services", situation: "Supporting people in homes and community settings.", help: "Check-ins and location sharing keep them connected to support.", draft: true },
      { name: "Mobile Workers", situation: "Working alone between multiple locations.", help: "Check-in and location sharing help provide visibility when support is needed.", draft: false }
    ];
    const PRICES = [["$9.95", "$9.45", "$9.05"], ["$12.95", "$12.05", "$11.15"]];
    const TIERS = ["1–24", "25–99", "100+"];
    let note = "Monthly price is charged per user.";
    if (s.pMon === 0 && s.pTier === 2) note = "Listed price covers 100–249 users; custom pricing above.";
    const FAQ = [
      ["IMPLEMENTATION", "How quickly can LWS Protect be deployed?", "Typically within 48 hours, depending on onboarding requirements."],
      ["USAGE", "Do employees need a dedicated device?", "No. LWS Protect uses the smartphone employees already carry. It works on Android and Apple devices."],
      ["PROTECTION", "Can we use our own security team?", "Yes. Alerts can be routed to your own response personnel."],
      ["PROTECTION", "Is 24/7 monitoring available?", "Yes. Professional monitoring is available as an optional service."]
    ];
    return {
      monOpts: MONL.map((l, i) => ({ label: l, pressed: s.mon === i ? "true" : "false",
        style: seg + (s.mon === i ? "background: #1a1a1a; color: #ffffff;" : "background: #ffffff; color: #3a3a37;") + (i ? " border-left: 1px solid #1a1a1a;" : ""), pick: () => set({ mon: i }) })),
      journey: J[s.mon].map((j, i) => ({ n: "0" + (i + 1), title: j[0], body: j[1], tbc: j[2],
        dot: i === 0 || i === 4 ? "background: #1a1a1a;" : "background: #ffffff; border: 3px solid #1a1a1a; box-sizing: border-box;" })),
      monPromise: s.mon === 0 ? "Self-monitored — you manage the response." : "24/7 professionally monitored — we manage the response.",
      monNote: "Pricing for both options is below.",
      inds: IND.map((x, i) => ({ name: x.name, pressed: s.ind === i ? "true" : "false",
        style: "min-height: 44px; padding: 0 16px; border-radius: 3px; cursor: pointer; font: 600 14px system-ui; " + (s.ind === i ? "background: #1a1a1a; color: #ffffff; border: 1px solid #1a1a1a;" : "background: #ffffff; color: #1a1a1a; border: 1px solid #c9c9c5;"),
        pick: () => set({ ind: i }) })),
      ind: Object.assign({ img: "CONTEXT IMAGE — " + IND[s.ind].name.toUpperCase() }, IND[s.ind]),
      priceMon: ["Self-Monitored", "24/7 Monitored"].map((l, i) => ({ label: l, pressed: s.pMon === i ? "true" : "false",
        style: seg + (s.pMon === i ? "background: #1a1a1a; color: #ffffff;" : "background: #ffffff; color: #3a3a37;") + (i ? " border-left: 1px solid #1a1a1a;" : ""), pick: () => set({ pMon: i }) })),
      priceTier: TIERS.map((l, i) => ({ label: l, pressed: s.pTier === i ? "true" : "false",
        style: "min-height: 46px; border-radius: 4px; cursor: pointer; font: 600 15px system-ui; " + (s.pTier === i ? "background: #1a1a1a; color: #ffffff; border: 1px solid #1a1a1a;" : "background: #ffffff; color: #1a1a1a; border: 1px solid #c9c9c5;"), pick: () => set({ pTier: i }) })),
      price: { amount: PRICES[s.pMon][s.pTier], note: note },
      faqs: FAQ.map((f, i) => ({ cat: f[0], q: f[1], a: f[2], open: s.faqOpen === i, expanded: s.faqOpen === i ? "true" : "false", sign: s.faqOpen === i ? "\u2212" : "+",
        toggle: () => set({ faqOpen: s.faqOpen === i ? -1 : i }) })),
      step: s.step
    };
  }
}

const comp = new Component({});
const tpl = document.getElementById('tpl');
const mount = document.getElementById('app');
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
function look(path, scope){
  path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  const parts = path.split('.'); let v = scope;
  for (const p of parts){ if (v == null) return undefined; v = v[p]; }
  return v;
}
function whole(str){ const m = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/.exec(str); return m ? m[1] : null; }
function interp(str, scope){ return str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); }); }
function renderNode(n, scope, out){
  if (n.nodeType === 3){ out.push(document.createTextNode(interp(n.nodeValue, scope))); return; }
  if (n.nodeType !== 1) return;
  const tag = n.localName;
  if (tag === 'sc-for'){
    const list = look(whole(n.getAttribute('list')), scope) || [];
    const as = n.getAttribute('as') || 'item';
    list.forEach((item, idx) => { const sc = Object.create(scope); sc[as] = item; sc.$index = idx; n.childNodes.forEach(c => renderNode(c, sc, out)); });
    return;
  }
  if (tag === 'sc-if'){ if (look(whole(n.getAttribute('value')), scope)) n.childNodes.forEach(c => renderNode(c, scope, out)); return; }
  const el = n.namespaceURI && n.namespaceURI !== 'http://www.w3.org/1999/xhtml' ? document.createElementNS(n.namespaceURI, n.tagName) : document.createElement(tag);
  for (const a of n.attributes){
    const w = whole(a.value);
    if (a.name.startsWith('on') && w){ const fn = look(w, scope); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); continue; }
    if (a.name.startsWith('hint-')) continue;
    el.setAttribute(a.name, interp(a.value, scope));
  }
  const kids = []; n.childNodes.forEach(c => renderNode(c, scope, kids)); kids.forEach(k => el.appendChild(k));
  out.push(el);
}
function render(){
  const vals = comp.renderVals(); const out = [];
  tpl.content.childNodes.forEach(c => renderNode(c, vals, out));
  mount.replaceChildren(...out);
}
render();
